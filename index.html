let peer = null;

let roomId = "";

let myId = "";

let players = [];

let started = false;
let currentTurn = 0;

/* =========================================================
   UTILITÁRIOS
========================================================= */

function random(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(array){
  return [...array].sort(()=>Math.random()-.5);
}

function getPlayer(id){
  return players.find(p=>p.id===id);
}

function isMyTurn(){
  return started &&
         players[currentTurn] &&
         players[currentTurn].id === myId;
}


/* =========================================================
   PEERJS
========================================================= */

function createPeer(){

  peer = new Peer(undefined,{
    debug:2,
    config:{
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"stun:stun1.l.google.com:19302"}
      ]
    }
  });

  peer.on("open",id=>{
    myId=id;

    document.getElementById("connectionStatus").textContent=
      "🟢 Conectado";
  });

  peer.on("connection",connection=>{

    if(players.length>=MAX_JOGADORES){
      connection.close();
      return;
    }

    setupConnection(connection);
  });

  peer.on("error",err=>{
    console.log(err);

    document.getElementById("connectionStatus").textContent=
      "⚠️ Erro de conexão";
  });
}


function setupConnection(c){

  c.on("open",()=>{

    connections.push(c);

    c.on("data",data=>{
      handleData(data,c);
    });

    c.on("close",()=>{
      connections=connections.filter(x=>x!==c);
    });

    if(isHost){

      c.send({
        type:"lobbyState",
        players:players
      });

    }

  });

  c.on("error",err=>{
    console.log(err);
  });
}


/* =========================================================
   CRIAR SALA
========================================================= */

function createRoom(){

  const name=
    document.getElementById("nameInput").value.trim();

  if(!name){
    alert("Digite seu nome.");
    return;
  }

  if(!peer){
    createPeer();
  }

  setTimeout(()=>{

    if(!myId){
      alert("Aguarde a conexão.");
      return;
    }

    isHost=true;

    roomId=
      "racismo-"+Math.random().toString(36).substring(2,8);

    myPlayer={
      id:myId,
      name:name,
      position:1,
      color:CORES[0],
      profession:null,
      items:[],
      acertos:0
    };

    players=[myPlayer];

    document.getElementById("roomArea")
      .classList.remove("hidden");

    document.getElementById("roomCode")
      .textContent=roomId;

    document.getElementById("startButton")
      .classList.remove("hidden");

    updateLobby();

  },500);
}


/* =========================================================
   ENTRAR NA SALA
========================================================= */

function joinRoom(){

  const name=
    document.getElementById("nameInput").value.trim();

  const code=
    document.getElementById("joinCode").value.trim();

  if(!name){
    alert("Digite seu nome.");
    return;
  }

  if(!code){
    alert("Digite o código da sala.");
    return;
  }

  if(!peer){
    createPeer();
  }

  setTimeout(()=>{

    conn=peer.connect(code);

    conn.on("open",()=>{

      roomId=code;

      conn.send({
        type:"join",
        name:name,
        id:myId
      });

      document.getElementById("roomArea")
        .classList.remove("hidden");

      document.getElementById("connectionStatus")
        .textContent="🟢 Conectado à sala";

    });

    conn.on("data",data=>{
      handleData(data,conn);
    });

  },500);
}


/* =========================================================
   MENSAGENS
========================================================= */

function broadcast(data){

  connections.forEach(c=>{
    if(c.open){
      c.send(data);
    }
  });

}


function sendToHost(data){

  if(conn && conn.open){
    conn.send(data);
  }

}


function handleData(data,c){

  if(data.type==="join" && isHost){

    if(players.length>=MAX_JOGADORES){
      c.send({
        type:"error",
        message:"A sala está cheia."
      });
      return;
    }

    if(players.some(p=>p.id===data.id))
      return;

    const color=
      CORES[players.length % CORES.length];

    players.push({
      id:data.id,
      name:data.name,
      position:1,
      color:color,
      profession:null,
      items:[],
      acertos:0
    });

    c.send({
      type:"joined",
      yourId:data.id,
      players:players
    });

    broadcast({
      type:"lobbyState",
      players:players
    });

    updateLobby();

    return;
  }


  if(data.type==="lobbyState"){

    players=data.players;

    myPlayer=getPlayer(myId);

    updateLobby();

    return;
  }


  if(data.type==="start"){

    players=data.players;

    currentTurn=data.currentTurn;

    started=true;

    myPlayer=getPlayer(myId);

    startInterface();

    return;
  }


  if(data.type==="profession"){

    const p=getPlayer(data.playerId);

    if(p){
      p.profession=data.profession;
    }

    updateBoard();
    updateHUD();

    return;
  }


  if(data.type==="state"){

    players=data.players;
    currentTurn=data.currentTurn;
    tempoRestante=data.time;

    myPlayer=getPlayer(myId);

    updateBoard();
    updateHUD();
    updateTurn();

    return;
  }


  if(data.type==="question"){

    showQuestion(
      data.question,
      data.playerId
    );

    return;
  }


  if(data.type==="itemDraw"){

    animateItemDraw(
      data.playerId,
      data.item
    );

    return;
  }


  if(data.type==="message"){

    showMessage(
      data.title,
      data.text
    );

    return;
  }


  if(data.type==="timeEnd"){

    finishGame();

    return;
  }

}


/* =========================================================
   LOBBY
========================================================= */

function updateLobby(){

  const div=
    document.getElementById("lobbyPlayers");

  div.innerHTML="";

  players.forEach((p,i)=>{

    const el=document.createElement("div");

    el.className="playerLine";

    el.innerHTML=
      `<span style="color:${p.color}">●</span>
       ${escapeHTML(p.name)}
       ${i===0?" 👑":""}`;

    div.appendChild(el);

  });

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

  if(!isHost) return;

  if(players.length<1) return;

  started=true;

  currentTurn=0;

  tempoRestante=TEMPO_TOTAL;

  broadcast({
    type:"start",
    players:players,
    currentTurn:currentTurn
  });

  startInterface();

  startProfessionDraw(myId);
}


function startInterface(){

  document.getElementById("lobby")
    .classList.add("hidden");

  document.getElementById("game")
    .classList.remove("hidden");

  buildBoard();

  updateBoard();

  updateHUD();

  updateTurn();

  startTimer();
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{

    if(!started) return;

    if(isHost){

      tempoRestante--;

      if(tempoRestante<=0){

        tempoRestante=0;

        broadcast({
          type:"timeEnd"
        });

        finishGame();

      }else{

        broadcast({
          type:"state",
          players:players,
          currentTurn:currentTurn,
          time:tempoRestante
        });

      }

    }

    updateHUD();

  },1000);

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  myPlayer=getPlayer(myId);

  if(!myPlayer) return;

  document.getElementById("hudName")
    .textContent=myPlayer.name;

    tempoRestante%60;

      `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

   TURNO
========================================================= */

function updateTurn(){

  const text=document.getElementById("turnText");

  if(p.id===myId){

/* =========================================================
   TABULEIRO
========================================================= */

function buildBoard(){

  const board=
    document.getElementById("board");

  board.innerHTML="";

  for(let i=1;i<=TOTAL_CASAS;i++){

    const cell=
      document.createElement("div");

    cell.className="cell";

    cell.id="cell-"+i;

    let icon="";

    if(i===1){
      cell.classList.add("start");
      icon="🏁";
    }

    if(i===TOTAL_CASAS){
      cell.classList.add("finish");
      icon="🏆";
    }

    if(PROBLEMAS[i]){
      cell.classList.add("problem");
      icon="⚠️";
    }

    if(SOLUCOES[i]){
      cell.classList.add("solution");
      icon="✅";
    }

    if(CASAS_PERGUNTA.includes(i)){
      cell.classList.add("question");
      icon="❓";
    }

    if(CASAS_ITEM.includes(i)){
      cell.classList.add("item");
      icon="🎁";
    }

    cell.innerHTML=
      `<span class="cellNumber">${i}</span>
       <div class="cellIcon">${icon}</div>
       <div class="people" id="people-${i}"></div>`;

    board.appendChild(cell);

  }

}


/* =========================================================
   ATUALIZAR PESSOAS
========================================================= */

function updateBoard(){

  for(let i=1;i<=TOTAL_CASAS;i++){

    const people=
      document.getElementById("people-"+i);

    if(people)
      people.innerHTML="";

  }

  players.forEach(p=>{

    const people=
      document.getElementById("people-"+p.position);

    if(!people) return;

    const person=
      document.createElement("div");

    person.className="person";

    person.innerHTML=`
      <div class="head"></div>
      <div class="body" style="background:${p.color}"></div>
      <div class="legs"></div>
    `;

    person.title=p.name;

    people.appendChild(person);

  });

}


/* =========================================================
   DADO
========================================================= */

async function rollDice(){

  if(!isMyTurn()) return;

  if(actionBusy) return;

  actionBusy=true;

  updateTurn();

  const dice=
    document.getElementById("dice");

  dice.classList.remove("diceRoll");

  void dice.offsetWidth;

  dice.classList.add("diceRoll");

  let value=1;

  for(let i=0;i<8;i++){

    value=random(1,6);

    dice.textContent=
      ["⚀","⚁","⚂","⚃","⚄","⚅"][value-1];

    await wait(80);

  }

  dice.classList.remove("diceRoll");

  if(isHost){

    await movePlayer(myId,value);

  }else{

    sendToHost({
      type:"roll",
      playerId:myId,
      value:value
    });

  }

}


/* =========================================================
   MOVIMENTO
========================================================= */

async function movePlayer(id,value){

  const p=getPlayer(id);

  if(!p) return;

  for(let i=0;i<value;i++){

    if(p.position>=TOTAL_CASAS)
      break;

    p.position++;

    updateBoard();
    updateHUD();

    await wait(220);
  }

  await resolveHouse(p);

}


/* =========================================================
   RECEBER JOGADA DO JOGADOR
========================================================= */

async function processRoll(data){

  if(!isHost) return;

  if(!started) return;

  if(players[currentTurn]?.id!==data.playerId)
    return;

  await movePlayer(
    data.playerId,
    data.value
  );

}


/* =========================================================
   RESOLVER CASA
========================================================= */

async function resolveHouse(p){

  if(p.position>=TOTAL_CASAS){

    broadcast({
      type:"state",
      players:players,
      currentTurn:currentTurn,
      time:tempoRestante
    });

    finishGame(p.id);

    return;
  }


  /* PROBLEMA */

  if(PROBLEMAS[p.position]){

    showMessage(
      "⚠️ Problema ambiental",
      PROBLEMAS[p.position]
    );

    await wait(900);

    p.position=
      Math.max(1,p.position-3);

    updateBoard();
    updateHUD();

    nextTurn();

    return;
  }


  /* SOLUÇÃO */

  if(SOLUCOES[p.position]){

    showMessage(
      "✅ Solução",
      SOLUCOES[p.position]
    );

    p.acertos++;

    await wait(900);

    nextTurn();

    return;
  }


  /* PERGUNTA */

  if(CASAS_PERGUNTA.includes(p.position)){

    if(isHost){

      const question=
        PERGUNTAS[
          random(0,PERGUNTAS.length-1)
        ];

      broadcast({
        type:"question",
        playerId:p.id,
        question:question
      });

      if(p.id===myId){
        showQuestion(question,p.id);
      }

    }

    return;
  }


  /* ITEM */

  if(CASAS_ITEM.includes(p.position)){

    const item=
      ITENS[random(0,ITENS.length-1)];

    p.items.push(item);

    broadcast({
      type:"itemDraw",
      playerId:p.id,
      item:item
    });

    if(p.id===myId){
      animateItemDraw(p.id,item);
    }

    await wait(1600);

    nextTurn();

    return;
  }


  nextTurn();

}


/* =========================================================
   PRÓXIMO TURNO
========================================================= */

function nextTurn(){

  if(!isHost) return;

  currentTurn++;

  if(currentTurn>=players.length)
    currentTurn=0;

  actionBusy=false;

  broadcast({
    type:"state",
    players:players,
    currentTurn:currentTurn,
    time:tempoRestante
  });

  updateBoard();
  updateHUD();
  updateTurn();

}


/* =========================================================
   RECEBER DADOS
========================================================= */

const originalHandleData=handleData;

function handleData(data,c){

  if(data.type==="roll"){

    processRoll(data);

    return;
  }

  if(data.type==="answer"){

    processAnswer(data);

    return;
  }

  originalHandleData(data,c);

}

/* =========================================================
   PERGUNTAS
========================================================= */

function showQuestion(question,playerId){

  if(playerId!==myId)
    return;

  perguntaAtual=question;
  perguntaPlayerId=playerId;

  const content=
    document.getElementById("modalContent");

  content.innerHTML=`
    <h2>❓ Pergunta</h2>

    <p>${escapeHTML(question.pergunta)}</p>

    <div id="answers"></div>
  `;

  const answers=
    document.getElementById("answers");

  question.opcoes.forEach((opcao,index)=>{

    const button=
      document.createElement("button");

    button.className="option";

    button.textContent=
      `${String.fromCharCode(65+index)}) ${opcao}`;

    button.onclick=()=>{
      answerQuestion(index);
    };

    answers.appendChild(button);

  });

  document.getElementById("modal")
    .classList.remove("hidden");

}


function answerQuestion(index){

  if(!perguntaAtual) return;

  const correta=
    index===perguntaAtual.correta;

  if(isHost){

    processAnswer({
      playerId:myId,
      correct:correta
    });

  }else{

    sendToHost({
      type:"answer",
      playerId:myId,
      correct:correta
    });

  }

}


function processAnswer(data){

  if(!isHost) return;

  const p=getPlayer(data.playerId);

  if(!p) return;

  closeModal();

  if(data.correct){

    p.acertos++;

    p.position=
      Math.min(
        TOTAL_CASAS,
        p.position+2
      );

    broadcast({
      type:"message",
      title:"🎉 Resposta correta!",
      text:`${p.name} avançou 2 casas.`
    });

    if(p.position>=TOTAL_CASAS){

      broadcast({
        type:"state",
        players:players,
        currentTurn:currentTurn,
        time:tempoRestante
      });

      finishGame(p.id);

      return;
    }

  }else{

    broadcast({
      type:"message",
      title:"❌ Resposta incorreta",
      text:`${p.name} permaneceu na casa.`
    });

  }

  nextTurn();

}

/* =========================================================
   FINAL DA PARTIDA
========================================================= */

function finishGame(winnerId=null){

  if(!started) return;

  clearInterval(timerInterval);

  started=false;

  document.getElementById("rollButton")
    .disabled=true;

  let winner=null;

  if(winnerId){

    winner=getPlayer(winnerId);

  }else{

    const ranking=
      [...players].sort((a,b)=>{

        if(b.position!==a.position)
          return b.position-a.position;

        if(b.items.length!==a.items.length)
          return b.items.length-a.items.length;

        return b.acertos-a.acertos;

      });

    if(ranking.length){

      const top=ranking[0];

      const empate=
        ranking.filter(p=>
          p.position===top.position &&
          p.items.length===top.items.length &&
          p.acertos===top.acertos
        );

      if(empate.length===1)
        winner=top;

    }

  }


  let html="<h2>🏆 Fim da partida!</h2>";

  if(winner){

    html+=`
      <p>
        <strong>${escapeHTML(winner.name)}</strong>
        venceu a partida!
      </p>

      <p>
        🏠 Casa: ${winner.position}<br>
        🎒 Itens: ${winner.items.length}<br>
        ❓ Respostas corretas: ${winner.acertos}
      </p>
    `;

  }else{

    html+=`
      <p>
        🤝 A partida terminou empatada!
      </p>
    `;

  }


  html+=`
    <h3>📊 Resultado</h3>
  `;


  const ranking=
    [...players].sort((a,b)=>{

      if(b.position!==a.position)
        return b.position-a.position;

      if(b.items.length!==a.items.length)
        return b.items.length-a.items.length;

      return b.acertos-a.acertos;

    });


  ranking.forEach((p,i)=>{

    html+=`
      <div class="playerLine">
        ${i+1}º —
        <span style="color:${p.color}">
          ●
        </span>
        ${escapeHTML(p.name)}
        —
        Casa ${p.position}
        —
        ${p.items.length} itens
        —
        ${p.acertos} acertos
      </div>
    `;

  });


  document.getElementById("modalContent")
    .innerHTML=html;

  document.getElementById("modal")
    .classList.remove("hidden");

}

function wait(ms){

  return new Promise(resolve=>
    setTimeout(resolve,ms)
  );

}

   INICIALIZAÇÃO
========================================================= */

window.addEventListener("load",()=>{

  createPeer();
