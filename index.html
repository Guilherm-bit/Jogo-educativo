/* =====================================================
   UTILIDADES
===================================================== */

function esperar(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );

}


function normalizar(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?;:]/g, "")
        .trim();

}


function respostaCorreta(resposta, correta) {

    const a = normalizar(resposta);

    const b = normalizar(correta);

    if (a === b) {
        return true;
    }

    return a.includes(b) || b.includes(a);

}


/* =====================================================
   CRIAR JOGADORES
===================================================== */

function novoJogador(nome) {

    return {

        nome: nome,

        posicao: 1,

        itens: 0,

        cor: colors[players.length]

    };

}


/* =====================================================
   PEERJS
===================================================== */

function criarPeer(id, callback) {

    peer = new Peer(id);

    peer.on("open", function(idRecebido) {

        callback(idRecebido);

    });


    peer.on("error", function(error) {

        console.error(error);

        if (error.type === "unavailable-id") {

            document.getElementById(
                "lobbyMessage"
            ).textContent =
                "❌ Essa sala já existe. Escolha outro código.";

        }

        else {

            document.getElementById(
                "lobbyMessage"
            ).textContent =
                "❌ Erro de conexão: " + error.type;

        }

    });


    peer.on("disconnected", function() {

        document.getElementById(
            "message"
        ).textContent =
            "⚠️ Conexão com o servidor de sinalização perdida.";

    });

}


/* =====================================================
   CRIAR SALA
===================================================== */

function criarSala() {

    const nome =
        document.getElementById(
            "nameInput"
        ).value.trim();


    if (!nome) {

        alert("Digite seu nome primeiro.");

        return;

    }


    isHost = true;


    roomCode =
        "racismo-" +
        Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();


    players = [];

    players.push(
        novoJogador(nome)
    );


    meuJogador = 0;


    criarPeer(
        roomCode,
        function() {

            document.getElementById(
                "roomCodeDisplay"
            ).textContent =
                "Sala: " + roomCode;


            document.getElementById(
                "lobbyMessage"
            ).textContent =
                "Você é o administrador da sala. Compartilhe o código!";


            document.getElementById(
                "startButton"
            ).style.display =
                "inline-block";


            atualizarLobby();

        }
    );


    peer.on("connection", receberConexao);

}


/* =====================================================
   MOSTRAR ENTRADA
===================================================== */

function mostrarEntradaSala() {

    document.getElementById(
        "joinArea"
    ).style.display =
        "block";

}


/* =====================================================
   ENTRAR NA SALA
===================================================== */

function entrarSala() {

    const nome =
        document.getElementById(
            "nameInput"
        ).value.trim();


    const codigo =
        document.getElementById(
            "roomInput"
        ).value.trim();


    if (!nome || !codigo) {

        alert(
            "Digite seu nome e o código da sala."
        );

        return;

    }


    isHost = false;

    roomCode = codigo;


    criarPeer(
        undefined,
        function() {

            hostConnection =
                peer.connect(
                    roomCode,
                    {
                        reliable: true
                    }
                );


            configurarConexaoCliente(
                hostConnection,
                nome
            );

        }
    );

}


/* =====================================================
   CONFIGURAR CLIENTE
===================================================== */

function configurarConexaoCliente(
    connection,
    nome
) {

    hostConnection =
        connection;


    connection.on("open", function() {

        connection.send({

            tipo: "entrar",

            nome: nome

        });


        document.getElementById(
            "lobbyMessage"
        ).textContent =
            "✅ Conectado à sala. Aguardando...";

    });


    connection.on("data", function(data) {

        receberMensagem(data);

    });


    connection.on("close", function() {

        alert(
            "O administrador encerrou a conexão."
        );

        location.reload();

    });


    connection.on("error", function() {

        document.getElementById(
            "lobbyMessage"
        ).textContent =
            "❌ Não foi possível entrar na sala.";

    });

}


/* =====================================================
   RECEBER NOVA CONEXÃO
===================================================== */

function receberConexao(connection) {

    connections.push(connection);


    connection.on("data", function(data) {

        if (
            data.tipo === "entrar"
        ) {

            adicionarJogador(
                connection,
                data.nome
            );

        }

        else if (
            data.tipo === "resposta"
        ) {

            processarResposta(
                connection,
                data.resposta
            );

        }

    });


    connection.on("close", function() {

        connections =
            connections.filter(
                c => c !== connection
            );

    });

}


/* =====================================================
   ADICIONAR JOGADOR
===================================================== */

function adicionarJogador(
    connection,
    nome
) {

    if (
        players.length >=
        MAX_JOGADORES
    ) {

        connection.send({

            tipo: "lotado"

        });

        return;

    }


    const jogador =
        novoJogador(nome);


    const index =
        players.length;


    players.push(jogador);


    connection.playerIndex =
        index;


    connection.send({

        tipo: "entrada",

        index: index,

        players: players

    });


    enviarEstado();

    atualizarLobby();

}


/* =====================================================
   ATUALIZAR LOBBY
===================================================== */

function atualizarLobby() {

    const div =
        document.getElementById(
            "waitingPlayers"
        );


    div.innerHTML =
        "<h3>👥 Jogadores na sala</h3>";


    players.forEach(
        (player, index) => {

            div.innerHTML +=
                `${player.cor.emoji}
                 ${player.nome}
                 ${index === 0 ? "👑" : ""}<br>`;

        }
    );


    if (players.length >= MAX_JOGADORES) {

        div.innerHTML +=
            "<br>🔴 Sala cheia.";

    }

}


/* =====================================================
   INICIAR JOGO
===================================================== */

function iniciarJogo() {

    if (!isHost) return;

    if (players.length < 1) return;


    jogoIniciado = true;

    currentPlayer = 0;

    tempoRestante =
        TEMPO_TOTAL;


    document.getElementById(
        "lobby"
    ).style.display =
        "none";


    document.getElementById(
        "game"
    ).style.display =
        "block";


    criarTabuleiro();

    atualizarTudo();

    iniciarCronometro();

    enviarEstado();

}


/* =====================================================
   RECEBER ENTRADA DO CLIENTE
===================================================== */

function receberMensagem(data) {

    if (!data) return;


    if (data.tipo === "entrada") {

        meuJogador =
            data.index;

        players =
            data.players;

        document.getElementById(
            "lobby"
        ).style.display =
            "none";

        document.getElementById(
            "game"
        ).style.display =
            "block";

        criarTabuleiro();

        atualizarTudo();

        return;

    }


    if (data.tipo === "estado") {

        players =
            data.players;

        currentPlayer =
            data.currentPlayer;

        jogoIniciado =
            data.jogoIniciado;

        tempoRestante =
            data.tempoRestante;


        if (
            document.getElementById(
                "game"
            ).style.display === "none"
        ) {

            document.getElementById(
                "lobby"
            ).style.display =
                "none";

            document.getElementById(
                "game"
            ).style.display =
                "block";

            criarTabuleiro();

        }


        atualizarTudo();

        return;

    }


    if (data.tipo === "passo") {

        players =
            data.players;

        atualizarTudo();

        return;

    }


    if (data.tipo === "pergunta") {

        mostrarPergunta(
            data.pergunta,
            data.playerIndex
        );

        return;

    }


    if (data.tipo === "fim") {

        players =
            data.players;

        atualizarTudo();

        document.getElementById(
            "message"
        ).textContent =
            data.mensagem;

        document.getElementById(
            "rollButton"
        ).disabled =
            true;

        return;

    }


    if (data.tipo === "lotado") {

        alert(
            "❌ A sala já possui 11 jogadores."
        );

        location.reload();

    }

}


/* =====================================================
   ENVIAR ESTADO
===================================================== */

function enviarEstado() {

    if (!isHost) return;


    const mensagem = {

        tipo: "estado",

        players: players,

        currentPlayer: currentPlayer,

        jogoIniciado: jogoIniciado,

        tempoRestante: tempoRestante

    };


    connections.forEach(
        connection => {

            if (
                connection.open
            ) {

                connection.send(
                    mensagem
                );

            }

        }
    );

}


/* =====================================================
   ATUALIZAR TUDO
===================================================== */

function atualizarTudo() {

    atualizarTabuleiro();

    atualizarJogadores();

    atualizarCor();

    atualizarTurno();

    atualizarProgresso();

    atualizarBotao();

    atualizarTimerVisual();

}


/* =====================================================
   TABULEIRO
===================================================== */

function criarTabuleiro() {

    const board =
        document.getElementById(
            "board"
        );


    board.innerHTML = "";


    for (
        let i = 1;
        i <= TOTAL_CASAS;
        i++
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.classList.add(
            "cell"
        );


        let tipo = "";


        if (problems[i]) {

            cell.classList.add(
                "problem"
            );

            tipo =
                "⚠️ Problema";

        }

        else if (solutions[i]) {

            cell.classList.add(
                "solution"
            );

            tipo =
                "✅ Solução";

        }

        else if (questions[i]) {

            cell.classList.add(
                "question"
            );

            tipo =
                "❓ Pergunta";

        }

        else if (items[i]) {

            cell.classList.add(
                "item"
            );

            tipo =
                "🎁 Item";

        }


        cell.innerHTML = `

            <div class="cell-number">
                ${i}
            </div>

            <div>
                ${tipo}
            </div>

            <div id="players-${i}"></div>

        `;


        board.appendChild(cell);

    }


    atualizarTabuleiro();

}


/* =====================================================
   ATUALIZAR TABULEIRO
===================================================== */

function atualizarTabuleiro() {

    for (
        let i = 1;
        i <= TOTAL_CASAS;
        i++
    ) {

        const area =
            document.getElementById(
                "players-" + i
            );


        if (area) {

            area.innerHTML = "";

        }

    }


    players.forEach(
        (player, index) => {

            const area =
                document.getElementById(
                    "players-" +
                    player.posicao
                );


            if (!area) return;


            const pawn =
                document.createElement(
                    "span"
                );


            pawn.classList.add(
                "pawn",
                player.cor.classe
            );


            pawn.textContent =
                "♟";


            pawn.title =
                player.nome;


            if (
                index === currentPlayer
            ) {

                pawn.classList.add(
                    "moving"
                );

            }


            area.appendChild(
                pawn
            );

        }
    );

}


/* =====================================================
   JOGADORES
===================================================== */

function atualizarJogadores() {

    const container =
        document.getElementById(
            "players"
        );


    container.innerHTML =
        "<h3>👥 Jogadores</h3>";


    players.forEach(
        (player, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player-info";


            div.innerHTML =

                player.cor.emoji +

                " <b>" +

                player.nome +

                "</b> — Casa " +

                player.posicao +

                " — 🎁 " +

                player.itens;


            if (
                index === currentPlayer
            ) {

                div.innerHTML +=
                    " 🎯";

            }


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   COR DO JOGADOR
===================================================== */

function atualizarCor() {

    if (
        meuJogador < 0 ||
        !players[meuJogador]
    ) return;


    const player =
        players[meuJogador];


    document.getElementById(
        "yourColor"
    ).textContent =

        "♟️ Você é " +

        player.cor.emoji +

        " " +

        player.cor.nome;

}


/* =====================================================
   TURNO
===================================================== */

function atualizarTurno() {

    if (
        !players[currentPlayer]
    ) return;


    document.getElementById(
        "turnText"
    ).textContent =

        "🎯 Vez de " +

        players[
            currentPlayer
        ].nome;

}


/* =====================================================
   PROGRESSO
===================================================== */

function atualizarProgresso() {

    if (
        !players[meuJogador]
    ) return;


    const player =
        players[meuJogador];


    const porcentagem =
        ((player.posicao - 1) /
        (TOTAL_CASAS - 1)) *
        100;


    document.getElementById(
        "progressBar"
    ).style.width =
        porcentagem + "%";


    document.getElementById(
        "progressText"
    ).textContent =

        "Seu progresso: " +

        player.posicao +

        " / " +

        TOTAL_CASAS +

        " casas";

}


/* =====================================================
   BOTÃO
===================================================== */

function atualizarBotao() {

    const button =
        document.getElementById(
            "rollButton"
        );


    button.disabled =

        !isHost ||

        !jogoIniciado ||

        currentPlayer !== meuJogador ||

        movimentoEmAndamento;

}


/* =====================================================
   DADO
===================================================== */

function animarDado(resultado) {

    return new Promise(
        resolve => {

            const dice =
                document.getElementById(
                    "dice"
                );


            dice.classList.add(
                "diceRolling"
            );


            let contador = 0;


            const intervalo =
                setInterval(
                    () => {

                        dice.textContent =
                            Math.floor(
                                Math.random() *
                                6
                            ) + 1;


                        contador++;


                        if (
                            contador >= 15
                        ) {

                            clearInterval(
                                intervalo
                            );


                            dice.classList.remove(
                                "diceRolling"
                            );


                            dice.textContent =
                                resultado;


                            resolve();

                        }

                    },
                    90
                );

        }
    );

}


/* =====================================================
   ROLAR DADO
===================================================== */

async function rollDice() {

    if (!isHost) return;

    if (
        currentPlayer !== meuJogador
    ) return;

    if (movimentoEmAndamento)
        return;


    movimentoEmAndamento =
        true;


    atualizarBotao();


    const resultado =
        Math.floor(
            Math.random() * 6
        ) + 1;


    document.getElementById(
        "message"
    ).textContent =
        "🎲 O dado está rolando...";


    await animarDado(
        resultado
    );


    const player =
        players[currentPlayer];


    document.getElementById(
        "message"
    ).textContent =

        "🎲 " +

        player.nome +

        " tirou " +

        resultado +

        "!";


    await esperar(500);


    await moverJogador(
        currentPlayer,
        resultado
    );


    await verificarCasa(
        currentPlayer
    );

}


/* =====================================================
   MOVIMENTO CASA POR CASA
===================================================== */

async function moverJogador(
    index,
    casas
) {

    const player =
        players[index];


    for (
        let i = 0;
        i < casas;
        i++
    ) {

        if (
            player.posicao >=
            TOTAL_CASAS
        ) {

            break;

        }


        player.posicao++;


        atualizarTudo();

        enviarEstado();


        document.getElementById(
            "message"
        ).textContent =

            "♟️ " +

            player.nome +

            " está avançando...";


        await esperar(350);

    }

}


/* =====================================================
   VERIFICAR CASA
===================================================== */

async function verificarCasa(
    index
) {

    const player =
        players[index];


    const posicao =
        player.posicao;


    if (
        problems[posicao]
    ) {

        document.getElementById(
            "message"
        ).textContent =

            problems[posicao];


        await esperar(1300);


        await moverJogador(
            index,
            -3
        );


        /*
           Movimento negativo
           tratado abaixo
        */

    }


    else if (
        solutions[posicao]
    ) {

        document.getElementById(
            "message"
        ).textContent =

            solutions[posicao];


        await esperar(1300);


        await moverJogador(
            index,
            3
        );

    }


    else if (
        items[posicao]
    ) {

        player.itens++;


        document.getElementById(
            "message"
        ).textContent =

            items[posicao];


        await esperar(1000);

    }


    else if (
        questions[posicao]
    ) {

        const pergunta =
            questions[posicao];


        perguntaAtual = {

            playerIndex: index,

            resposta:
                pergunta.resposta

        };


        enviarPergunta(
            pergunta.pergunta,
            index
        );


        return;

    }


    if (
        player.posicao >=
        TOTAL_CASAS
    ) {

        finalizarVitoria(
            index
        );

        return;

    }


    proximoTurno();

}


/* =====================================================
   MOVIMENTO NEGATIVO
===================================================== */

async function moverJogadorNegativo(
    index,
    casas
) {

    const player =
        players[index];


    for (
        let i = 0;
        i < casas;
        i++
    ) {

        if (
            player.posicao <= 1
        ) {

            break;

        }


        player.posicao--;


        atualizarTudo();

        enviarEstado();


        await esperar(350);

    }

}


/* =====================================================
   CORREÇÃO PARA MOVIMENTOS NEGATIVOS
===================================================== */

const moverOriginal =
    moverJogador;


moverJogador = async function(
    index,
    casas
) {

    if (casas < 0) {

        await moverJogadorNegativo(
            index,
            Math.abs(casas)
        );

        return;

    }


    await moverOriginal(
        index,
        casas
    );

};


/* =====================================================
   PERGUNTA
===================================================== */

function enviarPergunta(
    texto,
    playerIndex
) {

    const mensagem = {

        tipo: "pergunta",

        pergunta: texto,

        playerIndex: playerIndex

    };


    connections.forEach(
        connection => {

            if (
                connection.open
            ) {

                connection.send(
                    mensagem
                );

            }

        }
    );


    if (
        playerIndex ===
        meuJogador
    ) {

        mostrarPergunta(
            texto,
            playerIndex
        );

    }

}


/* =====================================================
   MOSTRAR PERGUNTA
===================================================== */

function mostrarPergunta(
    texto,
    playerIndex
) {

    if (
        playerIndex !==
        meuJogador
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "❓ " +
            players[playerIndex].nome +
            " está respondendo uma pergunta.";

        return;

    }


    document.getElementById(
        "questionText"
    ).textContent =
        texto;


    document.getElementById(
        "answerInput"
    ).value = "";


    document.getElementById(
        "questionModal"
    ).style.display =
        "flex";


    document.getElementById(
        "answerInput"
    ).focus();

}


/* =====================================================
   ENVIAR RESPOSTA
===================================================== */

function enviarResposta() {

    if (
        meuJogador !==
        currentPlayer
    ) return;


    const resposta =
        document.getElementById(
            "answerInput"
        ).value;


    document.getElementById(
        "questionModal"
    ).style.display =
        "none";


    if (isHost) {

        processarResposta(
            null,
            resposta
        );

    }

    else {

        hostConnection.send({

            tipo: "resposta",

            resposta: resposta

        });

    }

}


/* =====================================================
   PROCESSAR RESPOSTA
===================================================== */

async function processarResposta(
    connection,
    resposta
) {

    if (!isHost) return;


    if (!perguntaAtual) return;


    const playerIndex =
        perguntaAtual.playerIndex;


    const player =
        players[playerIndex];


    if (
        respostaCorreta(
            resposta,
            perguntaAtual.resposta
        )
    ) {

        document.getElementById(
            "message"
        ).textContent =

            "🎉 Resposta correta! " +

            player.nome +

            " avançou 2 casas!";


        await esperar(700);


        await moverJogador(
            playerIndex,
            2
        );

    }

    else {

        document.getElementById(
            "message"
        ).textContent =

            "❌ Resposta incorreta! " +

            player.nome +

            " permanece na casa.";

        await esperar(900);

    }


    perguntaAtual =
        null;


    enviarEstado();


    if (
        players[playerIndex].posicao >=
        TOTAL_CASAS
    ) {

        finalizarVitoria(
            playerIndex
        );

        return;

    }


    proximoTurno();

}


/* =====================================================
   PRÓXIMO TURNO
===================================================== */

function proximoTurno() {

    currentPlayer++;


    if (
        currentPlayer >=
        players.length
    ) {

        currentPlayer = 0;

    }


    movimentoEmAndamento =
        false;


    atualizarTudo();

    enviarEstado();


    document.getElementById(
        "message"
    ).textContent =

        "🎯 Agora é a vez de " +

        players[
            currentPlayer
        ].nome;

}


/* =====================================================
   VITÓRIA
===================================================== */

function finalizarVitoria(
    index
) {

    const vencedor =
        players[index];


    jogoIniciado =
        false;


    movimentoEmAndamento =
        true;


    const mensagem =

        "🏆 " +

        vencedor.nome +

        " venceu o jogo! " +

        vencedor.cor.emoji +

        " Chegou à casa " +

        TOTAL_CASAS +

        " e conquistou a vitória!";


    document.getElementById(
        "message"
    ).textContent =
        mensagem;


    document.getElementById(
        "rollButton"
    ).disabled =
        true;


    if (isHost) {

        connections.forEach(
            connection => {

                if (
                    connection.open
                ) {

                    connection.send({

                        tipo: "fim",

                        mensagem:
                            mensagem,

                        players:
                            players

                    });

                }

            }
        );

    }


    if (timer) {

        clearInterval(timer);

    }

}


/* =====================================================
   CRONÔMETRO
===================================================== */

function iniciarCronometro() {

    if (!isHost) return;


    if (timer) {

        clearInterval(timer);

    }


    timer =
        setInterval(
            () => {

                if (!jogoIniciado)
                    return;


                tempoRestante--;


                atualizarTimerVisual();

                enviarEstado();


                if (
                    tempoRestante <= 0
                ) {

                    clearInterval(
                        timer
                    );


                    finalizarPorTempo();

                }

            },
            1000
        );

}


/* =====================================================
   TIMER VISUAL
===================================================== */

function atualizarTimerVisual() {

    const minutos =
        Math.floor(
            tempoRestante / 60
        );


    const segundos =
        tempoRestante % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutos)
            .padStart(2,"0") +

        ":" +

        String(segundos)
            .padStart(2,"0");

}


/* =====================================================
   FIM PELO TEMPO
===================================================== */

function finalizarPorTempo() {

    let vencedor =
        players[0];


    players.forEach(
        player => {

            if (
                player.posicao >
                vencedor.posicao
            ) {

                vencedor =
                    player;

            }

        }
    );


    const mensagem =

        "⏰ O tempo acabou!\n\n" +

        "🏆 " +

        vencedor.nome +

        " (" +

        vencedor.cor.nome +

        ") está na frente, na casa " +

        vencedor.posicao +

        "!";


    jogoIniciado =
        false;


    movimentoEmAndamento =
        true;


    document.getElementById(
        "message"
    ).textContent =
        mensagem;


    document.getElementById(
        "rollButton"
    ).disabled =
        true;


    connections.forEach(
        connection => {

            if (
                connection.open
            ) {

                connection.send({

                    tipo: "fim",

                    mensagem:
                        mensagem,

                    players:
                        players

                });

            }

        }
    );

}


/* =====================================================
   INICIAL
===================================================== */

document.getElementById(
    "rollButton"
).disabled = true;


/* Enter responde pergunta */

document.getElementById(
    "answerInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            enviarResposta();

        }

    }
);

</script>
