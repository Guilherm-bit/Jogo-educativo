<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jogo Educativo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3ff;
    color: #222;
    text-align: center;
}

header {
    background: #3157d5;
    color: white;
    padding: 15px;
}

h1 {
    margin: 5px 0;
}

#timer {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

#game {
    max-width: 1050px;
    margin: auto;
    padding: 15px;
}

/* PAINEL */

#status {
    background: white;
    padding: 15px;
    border-radius: 16px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px #bbb;
}

#turnText {
    margin: 5px;
}

#yourColor {
    font-weight: bold;
    margin: 8px;
}

/* BARRA DE PROGRESSO */

.progress-container {
    width: 100%;
    height: 25px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #35a853;
    transition: width 0.3s;
}

#progressText {
    font-weight: bold;
}

/* DADO */

#diceArea {
    margin: 15px;
}

#dice {
    width: 80px;
    height: 80px;
    margin: auto;
    background: white;
    border: 4px solid #222;
    border-radius: 15px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 42px;
    font-weight: bold;

    box-shadow: 0 5px 10px #aaa;
}

.diceRolling {
    animation: diceRoll 0.12s linear infinite;
}

@keyframes diceRoll {

    0% {
        transform: rotate(0deg) scale(1);
    }

    25% {
        transform: rotate(90deg) scale(1.1);
    }

    50% {
        transform: rotate(180deg) scale(1);
    }

    75% {
        transform: rotate(270deg) scale(1.1);
    }

    100% {
        transform: rotate(360deg) scale(1);
    }

}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
}

#rollButton {
    background: #3157d5;
    color: white;
}

#rollButton:disabled {
    background: #999;
    cursor: not-allowed;
}

#message {
    min-height: 35px;
    font-weight: bold;
}

/* JOGADORES */

#players {
    background: white;
    padding: 12px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.player-info {
    display: inline-block;
    margin: 5px;
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: bold;
}

/* TABULEIRO */

#board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
}

.cell {
    min-height: 75px;
    background: white;
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 5px;
    font-size: 12px;
    position: relative;
}

.cell-number {
    font-weight: bold;
    font-size: 14px;
}

.problem {
    background: #ffd6d6;
    border-color: #e53935;
}

.solution {
    background: #d8f5d8;
    border-color: #35a853;
}

.question {
    background: #fff0bd;
    border-color: #f0ad00;
}

.item {
    background: #e3d8ff;
    border-color: #7b4bd6;
}

/* PEÕES */

.pawn {
    display: inline-flex;

    width: 28px;
    height: 28px;

    border-radius: 50% 50% 45% 45%;

    justify-content: center;
    align-items: center;

    margin: 2px;

    font-size: 18px;

    box-shadow: 0 2px 4px #777;

    transition: transform 0.2s;
}

.pawn.moving {
    transform: scale(1.25);
}

/* CORES DOS JOGADORES */

.red {
    background: #e53935;
}

.blue {
    background: #1e88e5;
}

.green {
    background: #43a047;
}

.yellow {
    background: #fdd835;
}

.purple {
    background: #8e24aa;
}

.orange {
    background: #fb8c00;
}

.pink {
    background: #ec407a;
}

.cyan {
    background: #00acc1;
}

.brown {
    background: #795548;
}

.black {
    background: #222;
}

.whitePawn {
    background: #eeeeee;
    border: 2px solid #555;
}

/* MOBILE */

@media (max-width: 600px) {

    #board {
        grid-template-columns: repeat(5, 1fr);
    }

    .cell {
        min-height: 62px;
        font-size: 10px;
    }

    .cell-number {
        font-size: 12px;
    }

    #dice {
        width: 70px;
        height: 70px;
    }

    button {
        width: 90%;
    }
}

</style>
</head>

<body>

<header>

    <h1>🎲 Jogo Educativo</h1>

    <div id="timer">
        20:00
    </div>

</header>


<div id="game">

    <div id="status">

        <h2 id="turnText">
            Jogador 1
        </h2>

        <div id="yourColor">
            ♟️ Você é o 🔴 Vermelho
        </div>


        <div class="progress-container">

            <div id="progressBar"></div>

        </div>

        <div id="progressText">
            Progresso: 1 / 80 casas
        </div>


        <div id="diceArea">

            <div id="dice">
                🎲
            </div>

        </div>


        <button
            id="rollButton"
            onclick="rollDice()">

            🎲 Rolar dado

        </button>


        <div id="message">

            Clique no dado para começar!

        </div>

    </div>


    <div id="players"></div>


    <div id="board"></div>

</div>


<script>

/* =====================================
   CONFIGURAÇÕES
===================================== */

const TOTAL_CASAS = 80;

const TEMPO_TOTAL = 20 * 60;

const NUM_JOGADORES = 11;


/* =====================================
   CORES DOS PEÕES
===================================== */

const colors = [

    {
        nome: "Vermelho",
        classe: "red",
        emoji: "🔴"
    },

    {
        nome: "Azul",
        classe: "blue",
        emoji: "🔵"
    },

    {
        nome: "Verde",
        classe: "green",
        emoji: "🟢"
    },

    {
        nome: "Amarelo",
        classe: "yellow",
        emoji: "🟡"
    },

    {
        nome: "Roxo",
        classe: "purple",
        emoji: "🟣"
    },

    {
        nome: "Laranja",
        classe: "orange",
        emoji: "🟠"
    },

    {
        nome: "Rosa",
        classe: "pink",
        emoji: "🌸"
    },

    {
        nome: "Ciano",
        classe: "cyan",
        emoji: "🔷"
    },

    {
        nome: "Marrom",
        classe: "brown",
        emoji: "🟤"
    },

    {
        nome: "Preto",
        classe: "black",
        emoji: "⚫"
    },

    {
        nome: "Branco",
        classe: "whitePawn",
        emoji: "⚪"
    }

];


/* =====================================
   JOGADORES
===================================== */

const players = [];

for (let i = 0; i < NUM_JOGADORES; i++) {

    players.push({

        nome: "Jogador " + (i + 1),

        posicao: 1,

        itens: [],

        cor: colors[i]

    });

}


/* =====================================
   CASAS ESPECIAIS
===================================== */

const problems = [

    7,
    16,
    25,
    34,
    43,
    52,
    61,
    70

];

const solutions = [

    11,
    20,
    29,
    38,
    47,
    56,
    65,
    74

];

const questions = [

    4,
    13,
    22,
    31,
    40,
    49,
    58,
    67,
    76

];

const items = [

    9,
    18,
    27,
    36,
    45,
    54,
    63,
    72

];


/* =====================================
   PERGUNTAS
===================================== */

const perguntas = [

    {
        pergunta: "Qual é o resultado de 5 + 7?",
        resposta: "12"
    },

    {
        pergunta: "Qual é o planeta conhecido como planeta vermelho?",
        resposta: "marte"
    },

    {
        pergunta: "Quantos dias tem uma semana?",
        resposta: "7"
    },

    {
        pergunta: "Qual é a capital do Brasil?",
        resposta: "brasilia"
    },

    {
        pergunta: "Quanto é 10 × 3?",
        resposta: "30"
    },

    {
        pergunta: "Qual é o maior planeta do Sistema Solar?",
        resposta: "jupiter"
    },

    {
        pergunta: "Quanto é 100 ÷ 10?",
        resposta: "10"
    },

    {
        pergunta: "Qual é o satélite natural da Terra?",
        resposta: "lua"
    },

    {
        pergunta: "Quantos meses existem em um ano?",
        resposta: "12"
    }

];


/* =====================================
   TABULEIRO
===================================== */

function criarTabuleiro() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    for (
        let i = 1;
        i <= TOTAL_CASAS;
        i++
    ) {

        const cell =
            document.createElement("div");

        cell.classList.add("cell");

        let tipo = "";

        if (problems.includes(i)) {

            cell.classList.add("problem");

            tipo = "⚠️ Problema";

        }

        else if (solutions.includes(i)) {

            cell.classList.add("solution");

            tipo = "✅ Solução";

        }

        else if (questions.includes(i)) {

            cell.classList.add("question");

            tipo = "❓ Pergunta";

        }

        else if (items.includes(i)) {

            cell.classList.add("item");

            tipo = "🎁 Item";

        }


        cell.innerHTML = `

            <div class="cell-number">
                ${i}
            </div>

            <div>
                ${tipo}
            </div>

            <div id="players-${i}"></div>

        `;

        board.appendChild(cell);

    }


    atualizarTabuleiro();

}


/* =====================================
   ATUALIZAR TABULEIRO
===================================== */

function atualizarTabuleiro() {

    for (
        let i = 1;
        i <= TOTAL_CASAS;
        i++
    ) {

        const area =
            document.getElementById(
                "players-" + i
            );

        if (area) {

            area.innerHTML = "";

        }

    }


    players.forEach((player) => {

        const area =
            document.getElementById(
                "players-" +
                player.posicao
            );

        if (!area) return;


        const pawn =
            document.createElement("span");

        pawn.classList.add(
            "pawn",
            player.cor.classe
        );

        pawn.textContent = "♟";

        pawn.title =
            player.nome +
            " — " +
            player.cor.nome;


        area.appendChild(pawn);

    });


    atualizarProgresso();

    atualizarJogadores();

}


/* =====================================
   PROGRESSO
===================================== */

function atualizarProgresso() {

    const player =
        players[currentPlayer];

    const porcentagem =
        ((player.posicao - 1) /
        (TOTAL_CASAS - 1)) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        porcentagem + "%";


    document.getElementById(
        "progressText"
    ).textContent =

        "Progresso: " +

        player.posicao +

        " / " +

        TOTAL_CASAS +

        " casas";

}


/* =====================================
   JOGADORES
===================================== */

function atualizarJogadores() {

    const container =
        document.getElementById("players");

    container.innerHTML =
        "<h3>♟️ Jogadores</h3>";


    players.forEach((player, index) => {

        const div =
            document.createElement("div");

        div.className =
            "player-info";


        div.innerHTML =

            player.cor.emoji +

            " <b>" +

            player.nome +

            "</b> — Casa " +

            player.posicao +

            " — 🎁 " +

            player.itens.length +

            " item(ns)";


        container.appendChild(div);

    });

}


/* =====================================
   MOSTRAR COR DO JOGADOR
===================================== */

function atualizarCorDoJogador() {

    const player =
        players[currentPlayer];


    document.getElementById(
        "yourColor"
    ).textContent =

        "♟️ Você é o " +

        player.cor.emoji +

        " " +

        player.cor.nome;

}


/* =====================================
   ANIMAÇÃO DO DADO
===================================== */

function animarDado(resultado) {

    return new Promise((resolve) => {

        const dice =
            document.getElementById("dice");


        dice.classList.add(
            "diceRolling"
        );


        let contador = 0;


        const intervalo =
            setInterval(() => {

                const numero =
                    Math.floor(
                        Math.random() * 6
                    ) + 1;


                dice.textContent =
                    numero;


                contador++;


                if (contador >= 12) {

                    clearInterval(intervalo);


                    dice.classList.remove(
                        "diceRolling"
                    );


                    dice.textContent =
                        resultado;


                    resolve();

                }

            }, 100);

    });

}


/* =====================================
   MOVIMENTO CASA POR CASA
===================================== */

async function moverPeao(player, casas) {

    for (
        let i = 0;
        i < casas;
        i++
    ) {

        if (
            player.posicao >=
            TOTAL_CASAS
        ) {

            break;

        }


        player.posicao++;


        atualizarTabuleiro();


        document.getElementById(
            "message"
        ).textContent =

            player.nome +

            " está andando... 🚶";


        await esperar(350);

    }

}


/* =====================================
   ESPERAR
===================================== */

function esperar(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* =====================================
   ROLAR DADO
===================================== */

async function rollDice() {

    const button =
        document.getElementById(
            "rollButton"
        );


    /* Impede vários cliques */

    button.disabled = true;


    const player =
        players[currentPlayer];


    const resultado =
        Math.floor(
            Math.random() * 6
        ) + 1;


    document.getElementById(
        "message"
    ).textContent =
        "🎲 O dado está rolando...";


    /* Animação do dado */

    await animarDado(resultado);


    await esperar(300);


    document.getElementById(
        "message"
    ).textContent =

        "🎲 " +

        player.nome +

        " tirou " +

        resultado +

        "!";


    await esperar(500);


    /* Movimento casa por casa */

    await moverPeao(
        player,
        resultado
    );


    /* Verificar casa especial */

    await verificarCasa(player);


    /* Vitória */

    if (
        player.posicao >=
        TOTAL_CASAS
    ) {

        vencer(player);

        return;

    }


    /* Próximo jogador */

    proximoJogador();

}


/* =====================================
   CASA ESPECIAL
===================================== */

async function verificarCasa(player) {

    const posicao =
        player.posicao;


    if (
        problems.includes(posicao)
    ) {

        document.getElementById(
            "message"
        ).textContent =

            "⚠️ Problema! " +

            player.nome +

            " voltou 3 casas.";


        await esperar(700);


        player.posicao =
            Math.max(
                1,
                player.posicao - 3
            );


        atualizarTabuleiro();

    }


    else if (
        solutions.includes(posicao)
    ) {

        document.getElementById(
            "message"
        ).textContent =

            "✅ Solução! " +

            player.nome +

            " avançou 3 casas.";


        await esperar(700);


        player.posicao =
            Math.min(
                TOTAL_CASAS,
                player.posicao + 3
            );


        atualizarTabuleiro();

    }


    else if (
        items.includes(posicao)
    ) {

        player.itens.push(
            "Item"
        );


        document.getElementById(
            "message"
        ).textContent =

            "🎁 " +

            player.nome +

            " encontrou um item!";


        await esperar(700);

    }


    else if (
        questions.includes(posicao)
    ) {

        await fazerPergunta(
            player
        );

    }


    atualizarTabuleiro();

}


/* =====================================
   PERGUNTA
===================================== */

async function fazerPergunta(player) {

    const numero =
        questions.indexOf(
            player.posicao
        );


    const pergunta =
        perguntas[
            numero %
            perguntas.length
        ];


    const resposta =
        prompt(

            "❓ PERGUNTA\n\n" +

            pergunta.pergunta

        );


    if (

        resposta &&

        resposta
            .trim()
            .toLowerCase() ===

        pergunta.resposta
            .toLowerCase()

    ) {

        document.getElementById(
            "message"
        ).textContent =

            "🎉 Resposta correta! " +

            player.nome +

            " avançou 2 casas!";


        await esperar(600);


        await moverPeao(
            player,
            2
        );

    }

    else {

        document.getElementById(
            "message"
        ).textContent =

            "❌ Resposta incorreta. " +

            player.nome +

            " permanece na casa.";

        await esperar(600);

    }

}


/* =====================================
   PRÓXIMO JOGADOR
===================================== */

function proximoJogador() {

    currentPlayer++;


    if (
        currentPlayer >=
        NUM_JOGADORES
    ) {

        currentPlayer = 0;

    }


    document.getElementById(
        "turnText"
    ).textContent =

        players[currentPlayer].nome;


    atualizarCorDoJogador();

    atualizarProgresso();


    document.getElementById(
        "rollButton"
    ).disabled = false;

}


/* =====================================
   VITÓRIA
===================================== */

function vencer(player) {

    document.getElementById(
        "message"
    ).textContent =

        "🏆 " +

        player.nome +

        " (" +

        player.cor.nome +

        ") chegou à casa 80 e venceu!";


    document.getElementById(
        "rollButton"
    ).disabled = true;


    clearInterval(timer);

}


/* =====================================
   CRONÔMETRO
===================================== */

let tempoRestante =
    TEMPO_TOTAL;


const timer =
    setInterval(() => {


        if (
            tempoRestante <= 0
        ) {

            clearInterval(timer);


            document.getElementById(
                "timer"
            ).textContent =
                "00:00";


            document.getElementById(
                "message"
            ).textContent =
                "⏰ O tempo acabou!";


            document.getElementById(
                "rollButton"
            ).disabled = true;


            verificarVencedorPorTempo();


            return;

        }


        tempoRestante--;


        const minutos =
            Math.floor(
                tempoRestante / 60
            );


        const segundos =
            tempoRestante % 60;


        document.getElementById(
            "timer"
        ).textContent =

            String(minutos)
                .padStart(2, "0") +

            ":" +

            String(segundos)
                .padStart(2, "0");


    }, 1000);


/* =====================================
   VENCEDOR PELO TEMPO
===================================== */

function verificarVencedorPorTempo() {

    let vencedor =
        players[0];


    players.forEach(
        player => {

            if (
                player.posicao >
                vencedor.posicao
            ) {

                vencedor =
                    player;

            }

        }
    );


    document.getElementById(
        "message"
    ).textContent =

        "⏰ Tempo acabou!\n\n" +

        "🏆 " +

        vencedor.nome +

        " (" +

        vencedor.cor.nome +

        ") está na frente, na casa " +

        vencedor.posicao +

        "!";


}


/* =====================================
   INICIAR JOGO
===================================== */

let currentPlayer = 0;

criarTabuleiro();

atualizarCorDoJogador();

atualizarProgresso();

</script>

</body>
  </html>
