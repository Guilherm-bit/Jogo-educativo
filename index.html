<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Caminhos da Justiça Ambiental</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
        linear-gradient(rgba(3,75,43,.68),rgba(2,48,31,.82)),
        radial-gradient(circle at 15% 15%,#55a630 0 5%,transparent 6%),
        radial-gradient(circle at 85% 20%,#2d6a4f 0 7%,transparent 8%),
        linear-gradient(135deg,#1b7a4b,#0b5130 45%,#063b25);
    background-attachment:fixed;
    color:#173d2b;
    overflow-x:hidden;
}

/* =========================
   LOBBY
========================= */

#lobby{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.lobby-box{
    width:min(500px,100%);
    background:rgba(255,255,255,.96);
    border-radius:28px;
    padding:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.35);
    border:5px solid #35a866;
    text-align:center;
}

.lobby-box h1{
    margin:0 0 8px;
    color:#146c43;
    font-size:30px;
}

.lobby-box p{
    color:#547265;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:15px;
    border:2px solid #b8d8c8;
    border-radius:15px;
    font-size:17px;
    outline:none;
    margin-bottom:12px;
}

.input:focus{
    border-color:#24a15a;
}

.btn{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
    color:white;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-green{
    background:linear-gradient(135deg,#28a85c,#087c42);
}

.btn-blue{
    background:linear-gradient(135deg,#21a9c8,#1477d4);
}

.btn-purple{
    background:linear-gradient(135deg,#3924c9,#21127d);
}

.room-code{
    margin:18px 0;
    padding:15px;
    border-radius:15px;
    background:#e9f8ef;
    border:2px dashed #39a865;
    font-size:23px;
    font-weight:bold;
    letter-spacing:3px;
    color:#12643e;
}

#playersLobby{
    margin-top:15px;
    text-align:left;
    background:#f2faf5;
    padding:12px;
    border-radius:14px;
}

.lobby-player{
    padding:8px;
    border-bottom:1px solid #d8e9df;
}

.hidden{
    display:none!important;
}

/* =========================
   JOGO
========================= */

#game{
    display:none;
    min-height:100vh;
    padding:7px 5px 30px;
}

/* =========================
   TABULEIRO
========================= */

.board-wrapper{
    width:min(1100px,100%);
    margin:0 auto;
    background:
        radial-gradient(circle at 10% 20%,rgba(104,177,89,.5),transparent 15%),
        radial-gradient(circle at 90% 70%,rgba(49,137,82,.5),transparent 18%),
        linear-gradient(145deg,#126c45,#1d8251 50%,#075137);
    border:5px solid #a8e1bd;
    border-radius:32px;
    padding:10px;
    box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.12),
        0 10px 30px rgba(0,0,0,.3);
    position:relative;
}

.board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(15,58px);
    gap:3px;
    padding:3px;
}

/* =========================
   CASAS
========================= */

.cell{
    position:relative;
    z-index:2;
    border-radius:10px;
    min-width:0;
    min-height:0;
    background:linear-gradient(145deg,#f1d7ad,#d8b47c);
    border:2px solid rgba(104,73,37,.35);
    box-shadow:
        0 3px 5px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
}

/* =========================
   CAMINHOS
========================= */

.path-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
}

.path-line{
    fill:none;
    stroke:#8bd39e;
    stroke-width:9;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.75;
}

.path-highlight{
    fill:none;
    stroke:#d6f2b8;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:.65;
}

/* =========================
   NÚMEROS
========================= */

.cell.normal .number{
    position:absolute;
    left:5px;
    top:3px;
    font-size:13px;
    font-weight:bold;
    color:#26372f;
}

.cell.special .number{
    display:none;
}

.cell.special{
    color:white;
}

.cell.problem{
    background:linear-gradient(145deg,#ff7b82,#e84b51);
    border-color:#c9343d;
}

.cell.solution{
    background:linear-gradient(145deg,#73e09a,#25b965);
    border-color:#17934b;
}

.cell.question{
    background:linear-gradient(145deg,#b991ff,#7650d4);
    border-color:#633db8;
}

.cell.item{
    background:linear-gradient(145deg,#66dff2,#20b8d2);
    border-color:#1299b0;
}

.cell.finish{
    background:linear-gradient(145deg,#ffd95b,#eeb626);
    border-color:#d09a0b;
}

.special-icon{
    font-size:23px;
    line-height:1;
}

.special-label{
    font-size:8px;
    font-weight:bold;
    margin-top:3px;
}

/* =========================
   JOGADORES
========================= */

.tokens{
    position:absolute;
    left:3px;
    right:3px;
    bottom:3px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:2px;
    z-index:5;
}

.token{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid white;
    box-shadow:0 1px 3px rgba(0,0,0,.5);
    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.token.moving{
    animation:
        tokenJump .18s ease,
        tokenGlow .18s ease;
}

@keyframes tokenJump{
    0%{
        transform:translateY(5px) scale(.75);
    }

    60%{
        transform:translateY(-5px) scale(1.18);
    }

    100%{
        transform:translateY(0) scale(1);
    }
}

@keyframes tokenGlow{
    0%{
        box-shadow:0 1px 3px rgba(0,0,0,.5);
    }

    50%{
        box-shadow:0 0 12px rgba(255,255,255,.9);
    }

    100%{
        box-shadow:0 1px 3px rgba(0,0,0,.5);
    }
}

/* =========================
   LEGENDA
========================= */

.legend{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.legend-item{
    background:rgba(7,43,35,.78);
    color:#e7f5ee;
    border-radius:18px;
    padding:7px 12px;
    font-size:13px;
    font-weight:bold;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

/* =========================
   HUD
========================= */

.bottom-hud{
    width:min(1100px,100%);
    margin:12px auto 0;
    background:rgba(22,22,22,.92);
    border:3px solid rgba(33,144,78,.65);
    border-radius:28px;
    padding:18px 16px 20px;
    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 0 20px rgba(0,0,0,.18);
}

/* =========================
   DADO
========================= */

.dice-area{
    text-align:center;
    margin-bottom:12px;
}

.dice-box{
    display:inline-block;
    cursor:pointer;
    user-select:none;
}

.dice{
    width:145px;
    height:145px;
    margin:auto;
    border-radius:30px;
    background:#f4f4f4;
    border:5px solid #079b3c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:86px;
    box-shadow:
        0 5px 15px rgba(0,0,0,.35),
        inset 0 0 12px rgba(0,0,0,.12);
    transition:.15s;
}

.dice.rolling{
    animation:diceRolling .75s ease-in-out;
}

@keyframes diceRolling{

    0%{
        transform:rotate(0deg) scale(1);
    }

    15%{
        transform:rotate(18deg) scale(1.08);
    }

    30%{
        transform:rotate(-18deg) scale(.94);
    }

    45%{
        transform:rotate(15deg) scale(1.08);
    }

    60%{
        transform:rotate(-15deg) scale(.96);
    }

    75%{
        transform:rotate(8deg) scale(1.05);
    }

    100%{
        transform:rotate(0deg) scale(1);
    }

}

.dice-box:active .dice{
    transform:scale(.95);
}

.dice-text{
    font-weight:bold;
    color:#e5eee9;
    margin-top:9px;
    font-size:25px;
}

/* =========================
   CARD
========================= */

.current-player{
    width:min(640px,100%);
    margin:0 auto 12px;
    background:linear-gradient(135deg,#102f36,#102a35);
    border:3px solid #b47a00;
    border-radius:22px;
    padding:16px 18px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.current-player-name{
    font-size:23px;
    font-weight:bold;
    color:#dcece4;
    margin-bottom:8px;
}

.player-stats{
    color:#b9cbc4;
    font-size:17px;
    line-height:1.7;
}

/* =========================
   BOTÕES
========================= */

.action-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:8px;
}

.action-btn{
    border:0;
    color:white;
    border-radius:20px;
    padding:15px 22px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 10px rgba(0,0,0,.25);
    transition:.15s;
}

.action-btn:active{
    transform:scale(.96);
}

.action-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.action-btn.roll{
    background:linear-gradient(135deg,#006d21,#004d17);
}

.action-btn.items{
    background:linear-gradient(135deg,#0879a8,#00557c);
}

.action-btn.how{
    background:linear-gradient(135deg,#2113a3,#17086e);
}

/* =========================
   VEZ
========================= */

.turn-indicator{
    margin-top:14px;
    background:linear-gradient(135deg,#003c20,#002f19);
    border-radius:17px;
    padding:16px;
    text-align:center;
    color:#d9eee4;
    font-size:23px;
    font-weight:bold;
    box-shadow:inset 0 0 10px rgba(0,0,0,.2);
}

/* =========================
   MODAIS
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    width:min(520px,100%);
    max-height:85vh;
    overflow:auto;
    background:white;
    border-radius:25px;
    padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.modal-box h2{
    color:#176942
